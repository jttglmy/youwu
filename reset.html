<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>有物 · 更新缓存</title>
<style>
  body {
    margin: 0; padding: 32px 20px;
    font: 16px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #f6f2ea; color: #241f19;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { color: #6f6659; font-size: 14px; }
  button {
    width: 100%; height: 52px; margin-top: 20px;
    border: 0; border-radius: 14px; background: #2f6a4f; color: #fff;
    font-size: 16px; font-weight: 600;
  }
  #log { margin-top: 18px; font-size: 13px; color: #6f6659; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>更新网页缓存</h1>
<p>这个页面只会清掉浏览器缓存的网页文件和旧的后台缓存，<b>不会删除你记录的物品和照片</b>。</p>
<button id="go">清理并重新打开「有物」</button>
<pre id="log"></pre>

<script>
var logEl = document.getElementById('log');
function log(s) { logEl.textContent += s + '\n'; }

document.getElementById('go').addEventListener('click', async function () {
  log('开始清理…');
  try {
    if ('serviceWorker' in navigator) {
      var regs = await navigator.serviceWorker.getRegistrations();
      for (var i = 0; i < regs.length; i++) {
        await regs[i].unregister();
        log('已注销后台服务');
      }
    }
  } catch (e) { log('注销失败：' + e.message); }

  try {
    if (window.caches) {
      var keys = await caches.keys();
      for (var j = 0; j < keys.length; j++) {
        await caches.delete(keys[j]);
        log('已清除缓存：' + keys[j]);
      }
    }
  } catch (e) { log('清缓存失败：' + e.message); }

  log('完成，正在打开…');
  setTimeout(function () { location.replace('./'); }, 700);
});
</script>
</body>
</html>
